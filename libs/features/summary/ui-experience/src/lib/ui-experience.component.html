@let exp = experience();
<mat-card appearance="outlined">
  <mat-card-header>
    @if(exp?.employer?.logo) {
      <div mat-card-avatar [style.background-image]="logo()"></div>
    }
    <mat-card-title>{{ exp?.employer?.name | st }}</mat-card-title>
    <mat-card-subtitle>{{ exp?.employer?.position | st }} - {{ exp?.employer?.period | st }}</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <h5>{{'summary.experience' | t}}</h5>
    <mat-divider></mat-divider>
    <p>
      {{ exp?.description | st }}
    </p>
    <h5>{{'summary.techStack' | t}}</h5>
    <mat-divider></mat-divider>
    <mp-ui-logo-pool [items]="exp?.techStack ?? []"></mp-ui-logo-pool>
  </mat-card-content>
</mat-card>
