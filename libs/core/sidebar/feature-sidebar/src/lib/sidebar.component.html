<mat-card appearance="outlined">
  <mat-card-content>
    <mp-sidebar-ui-avatar
      [source]="profile.avatarUrl"
      [alt]="profile.fullName"
    >
    </mp-sidebar-ui-avatar>
    <h3 class="heading-1">{{ profile.fullName }}</h3>
    <h4 class="heading-2">{{ profile.position }}</h4>
    <mat-divider></mat-divider>
    <mat-list role="list">
      @for (item of navigation.routes; track item.label) {
        <mat-list-item
          [routerLink]="item.route"
          [routerLinkActiveOptions]="{exact:true}"
          routerLinkActive="router-link-active"
          role="listitem">
          {{ item.label }}
        </mat-list-item>
      }
    </mat-list>
  </mat-card-content>
</mat-card>
